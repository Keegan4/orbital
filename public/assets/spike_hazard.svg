<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!--
    Spike hazard (top-down). Cartoon style: thick dark outline, flat fills,
    to match the tank sprites. 64x64 (2 cells at CELL_SIZE 16). Square footprint.
    A metal base plate with sharp spikes pointing up out of it.
  -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a5f66"/>
      <stop offset="1" stop-color="#3f434a"/>
    </linearGradient>
    <linearGradient id="spikeMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8dde3"/>
      <stop offset="0.5" stop-color="#a9b0b8"/>
      <stop offset="1" stop-color="#7c848d"/>
    </linearGradient>
  </defs>

  <!-- base plate -->
  <rect x="3" y="3" width="58" height="58" rx="8"
        fill="url(#plate)" stroke="#20242a" stroke-width="4"/>
  <!-- rivets in the corners -->
  <g fill="#2a2e34">
    <circle cx="13" cy="13" r="3"/><circle cx="51" cy="13" r="3"/>
    <circle cx="13" cy="51" r="3"/><circle cx="51" cy="51" r="3"/>
  </g>

  <!-- spikes: diamonds with a bright top-facet so they read as pointy/metal -->
  <!-- a helper look: each spike is a diamond, dark outline, light facet -->
  <g stroke="#20242a" stroke-width="3" stroke-linejoin="round">
    <!-- center -->
    <polygon points="32,16 42,32 32,48 22,32" fill="url(#spikeMetal)"/>
    <!-- top-left -->
    <polygon points="20,12 27,23 20,34 13,23" fill="url(#spikeMetal)"/>
    <!-- top-right -->
    <polygon points="44,12 51,23 44,34 37,23" fill="url(#spikeMetal)"/>
    <!-- bottom-left -->
    <polygon points="20,30 27,41 20,52 13,41" fill="url(#spikeMetal)"/>
    <!-- bottom-right -->
    <polygon points="44,30 51,41 44,52 37,41" fill="url(#spikeMetal)"/>
  </g>
  <!-- glint highlights on spike tips -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="29" cy="26" r="2.2"/>
    <circle cx="17" cy="20" r="1.6"/>
    <circle cx="41" cy="20" r="1.6"/>
    <circle cx="17" cy="38" r="1.6"/>
    <circle cx="41" cy="38" r="1.6"/>
  </g>
</svg>
