<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Grass base pattern -->
    <pattern id="grassTexture" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#4a8c3a"/>
      <path d="M8,22 Q9,17 10,22"  stroke="#3d7a2e" stroke-width="0.8" fill="none" opacity="0.6"/>
      <path d="M18,30 Q19,25 20,30" stroke="#6fb858" stroke-width="0.8" fill="none" opacity="0.5"/>
      <path d="M26,14 Q27,9 28,14"  stroke="#3d7a2e" stroke-width="0.8" fill="none" opacity="0.6"/>
      <path d="M32,28 Q33,23 34,28" stroke="#6fb858" stroke-width="0.8" fill="none" opacity="0.5"/>
      <path d="M14,10 Q15,5 16,10"  stroke="#5aa446" stroke-width="0.8" fill="none" opacity="0.5"/>
      <path d="M22,36 Q23,31 24,36" stroke="#3d7a2e" stroke-width="0.8" fill="none" opacity="0.6"/>
    </pattern>

    <!-- Asphalt pattern: dark gray with subtle speckles -->
    <pattern id="asphalt" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <rect width="30" height="30" fill="#4a4a4a"/>
      <circle cx="5"  cy="7"  r="0.9" fill="#3a3a3a"/>
      <circle cx="14" cy="3"  r="0.7" fill="#5e5e5e"/>
      <circle cx="22" cy="9"  r="1.0" fill="#3a3a3a"/>
      <circle cx="8"  cy="17" r="0.8" fill="#5e5e5e"/>
      <circle cx="19" cy="20" r="1.0" fill="#3a3a3a"/>
      <circle cx="2"  cy="24" r="0.7" fill="#5e5e5e"/>
      <circle cx="26" cy="25" r="0.9" fill="#3a3a3a"/>
      <circle cx="12" cy="11" r="0.5" fill="#6a6a6a"/>
      <circle cx="24" cy="14" r="0.5" fill="#6a6a6a"/>
    </pattern>

    <!-- Water pattern for center pond -->
    <pattern id="water" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#3d8ec9"/>
      <path d="M0,10 Q10,8 20,10 T40,10"  stroke="#5fa8db" stroke-width="1.2" fill="none" opacity="0.6"/>
      <path d="M0,22 Q10,20 20,22 T40,22" stroke="#7bbde6" stroke-width="1.0" fill="none" opacity="0.5"/>
      <path d="M0,34 Q10,32 20,34 T40,34" stroke="#5fa8db" stroke-width="1.2" fill="none" opacity="0.6"/>
    </pattern>

    <!-- Tree -->
    <symbol id="tree" viewBox="-30 -30 60 60">
      <ellipse cx="2" cy="22" rx="22" ry="6" fill="#000" opacity="0.18"/>
      <rect x="-4" y="5" width="8" height="18" fill="#5a3a1f" rx="2"/>
      <circle cx="0" cy="-2" r="20" fill="#2f6322"/>
      <circle cx="-12" cy="4" r="14" fill="#2f6322"/>
      <circle cx="12" cy="4" r="14" fill="#2f6322"/>
      <circle cx="-6" cy="-6" r="14" fill="#3d7a2e"/>
      <circle cx="8" cy="-4" r="13" fill="#3d7a2e"/>
      <circle cx="0" cy="6" r="14" fill="#3d7a2e"/>
      <circle cx="-8" cy="-10" r="6" fill="#5aa446" opacity="0.9"/>
      <circle cx="6" cy="-8" r="5" fill="#5aa446" opacity="0.9"/>
      <circle cx="-3" cy="-12" r="3" fill="#6fb858" opacity="0.9"/>
    </symbol>

    <!-- Flowers -->
    <symbol id="flowerYellow" viewBox="-6 -6 12 12">
      <circle cx="-2" cy="-2" r="1.8" fill="#ffeb47"/>
      <circle cx="2" cy="-1" r="1.8" fill="#ffeb47"/>
      <circle cx="-1" cy="2" r="1.8" fill="#ffeb47"/>
      <circle cx="2" cy="2" r="1.8" fill="#ffeb47"/>
      <circle cx="0" cy="0" r="0.8" fill="#d49a1a"/>
    </symbol>
    <symbol id="flowerWhite" viewBox="-6 -6 12 12">
      <circle cx="-2" cy="-2" r="1.8" fill="#ffffff"/>
      <circle cx="2" cy="-1" r="1.8" fill="#ffffff"/>
      <circle cx="-1" cy="2" r="1.8" fill="#ffffff"/>
      <circle cx="2" cy="2" r="1.8" fill="#ffffff"/>
      <circle cx="0" cy="0" r="0.8" fill="#ffd84d"/>
    </symbol>
    <symbol id="flowerPink" viewBox="-6 -6 12 12">
      <circle cx="-2" cy="-2" r="1.8" fill="#ff8fb1"/>
      <circle cx="2" cy="-1" r="1.8" fill="#ff8fb1"/>
      <circle cx="-1" cy="2" r="1.8" fill="#ff8fb1"/>
      <circle cx="2" cy="2" r="1.8" fill="#ff8fb1"/>
      <circle cx="0" cy="0" r="0.8" fill="#c44574"/>
    </symbol>
  </defs>

  <!-- Grass base -->
  <rect width="800" height="600" fill="url(#grassTexture)"/>

  <!-- Terrain variation in the four grass quadrants -->
  <ellipse cx="140" cy="120" rx="80" ry="50" fill="#6fb858" opacity="0.18"/>
  <ellipse cx="660" cy="130" rx="90" ry="55" fill="#6fb858" opacity="0.18"/>
  <ellipse cx="130" cy="490" rx="75" ry="45" fill="#6fb858" opacity="0.18"/>
  <ellipse cx="680" cy="480" rx="85" ry="50" fill="#6fb858" opacity="0.18"/>
  <ellipse cx="140" cy="280" rx="55" ry="32" fill="#2f6322" opacity="0.15"/>
  <ellipse cx="670" cy="300" rx="60" ry="35" fill="#2f6322" opacity="0.15"/>

  <!-- ============ HASHTAG ROAD LAYOUT ============ -->
  <!-- Lane width: 80, evenly spaced.
       Horizontal lanes at y = 180-260 and y = 340-420
       Vertical lanes at x = 240-320 and x = 480-560
       This forms a # shape across the 800x600 canvas. -->

  <!-- Dark grass border around roads (slight outline so road reads as carved into grass) -->
  <!-- Horizontal road 1 border -->
  <rect x="0" y="174" width="800" height="92" fill="#2f6322" opacity="0.45"/>
  <!-- Horizontal road 2 border -->
  <rect x="0" y="334" width="800" height="92" fill="#2f6322" opacity="0.45"/>
  <!-- Vertical road 1 border -->
  <rect x="234" y="0" width="92" height="600" fill="#2f6322" opacity="0.45"/>
  <!-- Vertical road 2 border -->
  <rect x="474" y="0" width="92" height="600" fill="#2f6322" opacity="0.45"/>

  <!-- Asphalt roads -->
  <rect x="0"   y="180" width="800" height="80" fill="url(#asphalt)"/>
  <rect x="0"   y="340" width="800" height="80" fill="url(#asphalt)"/>
  <rect x="240" y="0"   width="80"  height="600" fill="url(#asphalt)"/>
  <rect x="480" y="0"   width="80"  height="600" fill="url(#asphalt)"/>

  <!-- Subtle road edge shading (darker stripes along edges) -->
  <g opacity="0.35">
    <rect x="0"   y="180" width="800" height="3"  fill="#2a2a2a"/>
    <rect x="0"   y="257" width="800" height="3"  fill="#2a2a2a"/>
    <rect x="0"   y="340" width="800" height="3"  fill="#2a2a2a"/>
    <rect x="0"   y="417" width="800" height="3"  fill="#2a2a2a"/>
    <rect x="240" y="0"   width="3"   height="600" fill="#2a2a2a"/>
    <rect x="317" y="0"   width="3"   height="600" fill="#2a2a2a"/>
    <rect x="480" y="0"   width="3"   height="600" fill="#2a2a2a"/>
    <rect x="557" y="0"   width="3"   height="600" fill="#2a2a2a"/>
  </g>

  <!-- Dashed center lines on each lane (subtle) -->
  <g stroke="#d4d4a8" stroke-width="2" stroke-dasharray="14,12" opacity="0.55">
    <line x1="0"   y1="220" x2="800" y2="220"/>
    <line x1="0"   y1="380" x2="800" y2="380"/>
    <line x1="280" y1="0"   x2="280" y2="600"/>
    <line x1="520" y1="0"   x2="520" y2="600"/>
  </g>

  <!-- ============ CENTER POND ============ -->
  <!-- The pond sits in the central intersection box (320,260) to (480,340) area.
       In #Ouch this is the "pothole" of water in the middle. -->
  <g>
    <!-- Pond shadow / dark rim -->
    <rect x="346" y="266" width="108" height="68" rx="14" fill="#1d3a5a" opacity="0.7"/>
    <!-- Water surface -->
    <rect x="350" y="270" width="100" height="60" rx="12" fill="url(#water)"/>
    <!-- Highlights on water -->
    <ellipse cx="375" cy="285" rx="14" ry="3" fill="#ffffff" opacity="0.35"/>
    <ellipse cx="420" cy="315" rx="10" ry="2" fill="#ffffff" opacity="0.25"/>
  </g>

  <!-- ============ TREES (in the four grass quadrants, away from roads) ============ -->
  <!-- Top-left quadrant -->
  <use href="#tree" x="60"  y="40"  width="70" height="70"/>
  <use href="#tree" x="160" y="90"  width="60" height="60"/>
  <use href="#tree" x="80"  y="120" width="55" height="55"/>
  <!-- Top-middle (between vertical roads) -->
  <use href="#tree" x="370" y="50"  width="65" height="65"/>
  <!-- Top-right quadrant -->
  <use href="#tree" x="600" y="40"  width="70" height="70"/>
  <use href="#tree" x="700" y="90"  width="60" height="60"/>
  <use href="#tree" x="620" y="130" width="55" height="55"/>
  <!-- Bottom-left quadrant -->
  <use href="#tree" x="80"  y="450" width="65" height="65"/>
  <use href="#tree" x="160" y="500" width="60" height="60"/>
  <use href="#tree" x="50"  y="520" width="58" height="58"/>
  <!-- Bottom-middle -->
  <use href="#tree" x="370" y="500" width="65" height="65"/>
  <!-- Bottom-right quadrant -->
  <use href="#tree" x="620" y="450" width="70" height="70"/>
  <use href="#tree" x="700" y="510" width="60" height="60"/>
  <use href="#tree" x="600" y="520" width="55" height="55"/>
  <!-- Middle band sides (between the two horizontal roads, outside the vertical roads) -->
  <use href="#tree" x="100" y="270" width="60" height="60"/>
  <use href="#tree" x="680" y="270" width="60" height="60"/>

  <!-- ============ FLOWERS in grass areas only ============ -->
  <!-- Top-left -->
  <use href="#flowerYellow" x="35"  y="80"  width="14" height="14"/>
  <use href="#flowerWhite"  x="180" y="40"  width="14" height="14"/>
  <use href="#flowerPink"   x="130" y="150" width="14" height="14"/>
  <!-- Top-middle -->
  <use href="#flowerYellow" x="350" y="120" width="14" height="14"/>
  <use href="#flowerPink"   x="430" y="40"  width="14" height="14"/>
  <use href="#flowerWhite"  x="400" y="150" width="13" height="13"/>
  <!-- Top-right -->
  <use href="#flowerWhite"  x="590" y="150" width="14" height="14"/>
  <use href="#flowerYellow" x="680" y="40"  width="14" height="14"/>
  <use href="#flowerPink"   x="730" y="130" width="14" height="14"/>
  <!-- Middle-left band -->
  <use href="#flowerYellow" x="50"  y="300" width="14" height="14"/>
  <use href="#flowerPink"   x="170" y="290" width="13" height="13"/>
  <!-- Middle-right band -->
  <use href="#flowerWhite"  x="610" y="310" width="14" height="14"/>
  <use href="#flowerYellow" x="720" y="290" width="13" height="13"/>
  <!-- Bottom-left -->
  <use href="#flowerPink"   x="40"  y="490" width="14" height="14"/>
  <use href="#flowerWhite"  x="200" y="470" width="14" height="14"/>
  <use href="#flowerYellow" x="130" y="560" width="13" height="13"/>
  <!-- Bottom-middle -->
  <use href="#flowerWhite"  x="350" y="470" width="14" height="14"/>
  <use href="#flowerPink"   x="430" y="560" width="14" height="14"/>
  <use href="#flowerYellow" x="400" y="510" width="13" height="13"/>
  <!-- Bottom-right -->
  <use href="#flowerYellow" x="590" y="470" width="14" height="14"/>
  <use href="#flowerPink"   x="730" y="490" width="14" height="14"/>
  <use href="#flowerWhite"  x="660" y="560" width="13" height="13"/>

  <!-- Pebbles (only in grass) -->
  <g opacity="0.4">
    <circle cx="120" cy="60"  r="2"   fill="#8b7355"/>
    <circle cx="200" cy="130" r="2.5" fill="#8b7355"/>
    <circle cx="660" cy="60"  r="2"   fill="#8b7355"/>
    <circle cx="730" cy="160" r="2"   fill="#8b7355"/>
    <circle cx="110" cy="500" r="2.5" fill="#8b7355"/>
    <circle cx="720" cy="540" r="2"   fill="#8b7355"/>
    <circle cx="400" cy="110" r="2"   fill="#8b7355"/>
    <circle cx="400" cy="540" r="2"   fill="#8b7355"/>
  </g>
</svg>
